name: Expense Tracker

on:
  push:
    paths:
      - 'expense-tracker/**'
      - '.github/workflows/expense-tracker.yml'
  pull_request:
    paths:
      - 'expense-tracker/**'
      - '.github/workflows/expense-tracker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: expense-tracker-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: expense-tracker

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: expense-tracker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  android:
    name: Android APK
    needs: test
    runs-on: ubuntu-latest
    permissions:
      # Publishes the APK as the "expense-tracker-latest" release.
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: expense-tracker/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            expense-tracker/android/*.gradle*
            expense-tracker/android/app/*.gradle*
            expense-tracker/android/gradle/wrapper/gradle-wrapper.properties
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Build the APK
        working-directory: expense-tracker/android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: ./gradlew assembleRelease --no-daemon
      - run: cp android/app/build/outputs/apk/release/app-release.apk expense-tracker.apk
      - uses: actions/upload-artifact@v4
        with:
          name: expense-tracker-apk
          path: expense-tracker/expense-tracker.apk
      - name: Publish the APK
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete expense-tracker-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create expense-tracker-latest expense-tracker.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Expense Tracker for Android (build ${{ github.run_number }})" \
            --notes "Open this page on your Android phone and tap **expense-tracker.apk** to download it, then open the file to install. Android asks once to allow installs from your browser or Files app.

          Built from ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}. Newer builds install over this one and keep your data."

  pages:
    name: Web app (GitHub Pages)
    needs: test
    # Pages only deploys from the default branch, and needs Settings → Pages → Source: GitHub Actions.
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}expense-tracker/
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: expense-tracker/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: mkdir -p ../_site && cp -r dist ../_site/expense-tracker
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
